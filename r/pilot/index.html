    const SUPPORTED = new Set(LANGUAGES.map((l) => l.code));

    function pickLang() {
      const fromQuery = (params.get("lang") || "").toLowerCase();
      if (SUPPORTED.has(fromQuery)) return fromQuery;
      const saved = localStorage.getItem("m4th_redeem_lang");
      if (saved && SUPPORTED.has(saved)) return saved;
      const nav = (navigator.languages && navigator.languages[0]) || navigator.language || "en";

        btnApple.href = "#";

      meta.textContent = s.ready.replace("{batch}", batch);

      if (!APPLE_APP_ID) {
        e.preventDefault();

    const ua = navigator.userAgent || "";

    const isAndroid = /Android/i.test(ua);
    if (redeemCode) {
      if (isIOS) {
        btnPlay.classList.add("hidden");
        if (APPLE_APP_ID) setTimeout(() => { location.href = btnApple.href; }, 700);

        btnApple.classList.add("hidden");
